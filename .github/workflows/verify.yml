name: verify

on:
  push:
  pull_request:

jobs:
  # Docs-only changes start no CI run (docs get push, merge and publish only).
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # code=false only when every changed file is docs. Anything unknown counts as code.
          docs_re='(\.(md|mdx|rst|docx|pdf)$)|(^|/)(LICENSE|NOTICE)(\.[^/]*)?$|^docs/.*\.(png|jpe?g|svg|gif|webp|html|css)$'
          keep_re='(^|/)SKILL\.md$|(^|/)(skills|agents|commands|prompts|references)/|^\.claude/'
          files=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename') || files=""
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$SHA" --jq 'if (.files | length) >= 300 then empty else .files[].filename end') || files=""
          fi
          code=true
          if [ -n "$files" ]; then
            other=$(printf '%s\n' "$files" | grep -Ev "$docs_re" || true)
            kept=$(printf '%s\n' "$files" | grep -E "$docs_re" | grep -E "$keep_re" || true)
            if [ -z "$other" ] && [ -z "$kept" ]; then code=false; fi
          fi
          echo "Changed files:"; printf '%s\n' "$files" | head -50
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CivicCore release wheel
        run: python -m pip install "https://github.com/townlight/core/releases/download/v1.2.1/civiccore-1.2.1-py3-none-any.whl#sha256=8dde29408e206048bde63ec14156a8e6329382af4d16b12710d12aa5c27f3f59"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Start PostGIS test database
        run: |
          docker run -d --name civiczone-ci \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=civiczone_test \
            -p 127.0.0.1::5432 \
            pgvector/pgvector:pg17
          docker exec civiczone-ci apt-get update
          docker exec civiczone-ci apt-get install -y postgresql-17-postgis-3
          for i in $(seq 1 30); do
            if docker exec civiczone-ci pg_isready -h 127.0.0.1 -U postgres -d civiczone_test; then
              break
            fi
            sleep 1
          done
          docker exec civiczone-ci pg_isready -h 127.0.0.1 -U postgres -d civiczone_test
          PORT="$(docker port civiczone-ci 5432/tcp | awk -F: '{print $NF}')"
          test -n "$PORT"
          URL="postgresql+psycopg2://postgres:postgres@127.0.0.1:${PORT}/civiczone_test"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "CIVICZONE_TEST_DATABASE_URL=$URL" >> "$GITHUB_ENV"
      - name: Apply database migrations
        run: DATABASE_URL="$CIVICZONE_TEST_DATABASE_URL" alembic -c civiczone/migrations/alembic.ini upgrade head
      - name: Run release gate
        run: bash scripts/verify-release.sh
      - name: Remove PostGIS test database
        if: always()
        run: docker rm -f civiczone-ci || true
