[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "townlight-zoning"
version = "0.2.3"
description = "Townlight Zoning runtime foundation for parcel-aware zoning and land-use Q&A."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Townlight contributors" }
]
dependencies = [
    "townlight-core==1.3.0.dev2",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "psycopg2-binary>=2.9.0,<3.0.0",
  "pytest>=8.0.0,<9.0.0",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["townlight_zoning"]
force-include = { "townlight_zoning/migrations/alembic.ini" = "townlight_zoning/migrations/alembic.ini" }

[tool.hatch.build.targets.sdist]
include = [
  "townlight_zoning",
  "townlight_zoning/migrations/alembic.ini",
  "scripts",
  "tests",
  "README.md",
  "README.txt",
  "CHANGELOG.md",
  "USER-MANUAL.md",
  "USER-MANUAL.txt",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "SUPPORT.md",
  "CODE_OF_CONDUCT.md",
  "AGENTS.md",
  ".github",
  "docs",
  "MILESTONE_0_DONE.md",
  "MILESTONE_1_DONE.md",
  "MILESTONE_2_DONE.md",
  "MILESTONE_3_DONE.md",
  "MILESTONE_4_DONE.md",
  "MILESTONE_5_DONE.md",
  "MILESTONE_6_DONE.md",
  "MILESTONE_7_DONE.md",
  "MILESTONE_8_DONE.md",
  "PRODUCTION_DEPTH_PARCEL_RULE_PERSISTENCE_DONE.md",
  "PRODUCTION_DEPTH_QUESTION_LEDGER_DONE.md",
  "LICENSE-CODE",
  "LICENSE-DOCS",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
